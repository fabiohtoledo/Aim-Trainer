<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aim Trainer</title>

  <!-- link to the styles.css file -->
  <link rel="stylesheet" href="styles/styles.css"> 
  <link rel="stylesheet" href="styles/sidebar.css"> 
</head>
<body>
    <nav id="sidebar">
      <!-- site logo -->
      <div id="logo-cont">
        <img src="imgs/ph.svg" alt="logo">
        <p>Aim</p>
      </div>
      <!-- Modes -->
      <div class="divisor">
        <p>Modes</p>
      </div>
      <div class="sidebar-cont-modes">
        <div class="sidebar-link sb-active" id="personalized">
          <img src="imgs/personalized.svg" alt="">
          <p>Personalized</p>
        </div>
        <div class="sidebar-link"  id="personalized2">
          <img src="imgs/personalized.svg" alt="">
          <p>Personalized</p>
        </div>
      </div>
      <!-- Training -->
      <div class="divisor">
        <p>Training</p>
      </div>
      <div class="sidebar-cont-training">
        <div class="sidebar-link"  id="personalized3">
          <img src="imgs/personalized.svg" alt=" ">
          <p>Personalized</p>
        </div>
        <div class="sidebar-link"  id="personalized4">
          <img src="imgs/personalized.svg" alt="">
          <p>Personalized</p>
        </div>

      </div>
    </nav>
  <p id="timer-counter">30s</p>
  <h1>Aim Trainer</h1>
  <p>This is a simple aim trainer that allows you to practice your shooting skills.</p>
  <div id="input-area">
    <div class="items-line" id="timer-container">
      <p>Timer:</p>
      <input type="number" name="timer" id="timer-selector" value="30" min="1">
      <div class="spinner-buttons">
        <button type="button" id="btn-timer-up">▲</button>
        <button type="button" id="btn-timer-down">▼</button>
      </div>
    </div>

    <button onclick="startTraining()">Start Training</button>
    <div class="items-line" id="counter-container">
      <p>Hits: </p>
      <div id="hits-counter-text">0</div>
    </div>
    <div class="items-line" id="accuracy-container">
      <p>Accuracy: </p>
      <p id="hits-percentage">100%</p>
    </div>
    <div class="items-line" id="total-clicks-container">
      <p>Total Clicks: </p>
      <p id="hits-total">0</p>
    </div>
      <div class="items-line" id="total-targets-faded-container">
      <p>Total Targets Faded: </p>
      <p id="faded-total">0</p>
    </div>
  </div>


  <!-- clicker section or div area -->
  <div id="train-area" class="clicker-container">
    <!-- <button class="target"></button> -->
  </div>





  <script src="script.js"></script>
  <script src="scripts/sidebar.js"></script>


</body>
</html>
